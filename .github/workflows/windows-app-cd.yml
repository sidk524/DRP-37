name: Build and Release Windows App

on:
  push:
    branches:
      - main
      - master
      - WindowsApp
    paths:
      - 'WindowsApp/**'
      - '.github/workflows/windows-app-cd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: WindowsApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: WindowsApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        shell: pwsh
        run: |
          @"
          VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Build Windows app
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release tag
        id: tag
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          "tag_name=windows-build-$timestamp" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Windows Build ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          files: |
            WindowsApp/release/*.exe
            WindowsApp/release/*.msi
            WindowsApp/release/*.zip
            WindowsApp/release/*.blockmap