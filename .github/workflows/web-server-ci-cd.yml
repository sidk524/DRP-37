name: Web Server CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "web-server/**"
      - ".github/workflows/web-server-ci-cd.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test web server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: npm run check

      - name: Run tests
        run: npm run test

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    env:
      DEPLOY_DIR: /home/ec2-user/web-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload web server files
        run: |
          rsync -az --delete \
            --exclude node_modules \
            --exclude .env \
            -e "ssh -i ~/.ssh/ec2_key" \
            web-server/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${DEPLOY_DIR}/"

      - name: Install dependencies and restart app
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << EOF
            set -e
            cd "${DEPLOY_DIR}"
            npm ci --omit=dev
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi
            pm2 restart drp37-web-server || pm2 start src/server.js --name drp37-web-server
            pm2 save
          EOF
