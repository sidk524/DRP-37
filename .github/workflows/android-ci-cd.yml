name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
      - ci-test
    paths:
      - 'MyApplication/**'
      - '.github/workflows/android-ci-cd.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MyApplication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle' # Enables automatic caching of dependencies

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EOF

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Generate release tag
        id: tag
        run: echo "tag_name=build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Android Build ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          files: MyApplication/app/build/outputs/apk/debug/app-debug.apk