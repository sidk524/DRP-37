<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tether Friction</title>
  <link rel="stylesheet" href="theme.css" />
</head>
<body class="tether-blocked-shell">
  <main id="app" class="tether-blocked-main">
    <p class="tether-blocked-app-label">You're about to open this site</p>
    <div class="tether-breath-stage">
      <div class="tether-breath-circle">
        <span class="tether-breath-label">Breathe in</span>
      </div>
    </div>
    <p class="tether-blocked-hint">Take a breath before you scroll.</p>
  </main>
  <script src="sessionDisplay.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
