<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Animated cartoon safe with a spider web on its door that toggles between locked and unlocked states.</h2>
<style>
#vault-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0.5rem 0;}
#door,#dial,#spider,#strand,.bolt{transform-box:view-box;}
#dial{transform-origin:340px 210px;transition:transform .7s 1s ease-in-out;cursor:pointer;}
.open #dial{transform:rotate(-220deg);transition-delay:.15s;}
#door{transform-origin:224px 210px;transition:transform .8s .15s cubic-bezier(.55,-0.15,.35,1.15);}
.open #door{transform:scale(.13,1.03);transition-delay:.7s;}
.bolt{transition:transform .35s .9s ease;}
.open .bolt{transform:translateX(-18px);transition-delay:.5s;}
#web .tear{transition:opacity .45s 1.35s,transform .45s 1.35s;}
.open #web .tear{opacity:.95;transform:none;transition-delay:0s;}
#spider{opacity:0;transform:translateY(-135px);transition:transform .7s 0s ease-in,opacity .25s .3s;}
.open #spider{opacity:1;transform:translateY(0);transition:transform .9s 1.5s cubic-bezier(.3,1.5,.55,1),opacity .3s 1.5s;}
#strand{opacity:0;transition:opacity .3s 0s;}
.open #strand{opacity:.95;transition-delay:1.2s;}

#burst{transform-box:view-box;transform-origin:340px 388px;opacity:0;transform:scale(0) rotate(-12deg);transition:opacity .2s,transform .35s cubic-bezier(.3,1.8,.5,1);}
#vault-wrap.show-burst #burst{opacity:1;transform:scale(1) rotate(-7deg);}
#burst-text{font-family:"Arial Black",Impact,sans-serif;font-weight:900;font-size:21px;letter-spacing:0;text-anchor:middle;paint-order:stroke;stroke:#2E3148;stroke-width:5;stroke-linejoin:round;}
@keyframes burstWobble{0%,100%{transform:scale(1) rotate(-7deg);}50%{transform:scale(1.06) rotate(-4deg);}}
#vault-wrap.show-burst #burst{animation:burstWobble .9s ease-in-out infinite .35s;}

#status{font-size:14px;color:var(--color-text-secondary);display:flex;align-items:center;gap:8px;min-height:22px;}
</style>

<script>
(function(){
var NS="http://www.w3.org/2000/svg";
var web=document.getElementById("web");
var CX=340,CY=210,HUB=54,HALF=110;
var angles=[0,45,90,135,180,225,270,315];
var tearSpokes={45:1,90:1};
function rad(d){return d*Math.PI/180;}
function mk(tag,attrs,tear){var el=document.createElementNS(NS,tag);for(var k in attrs)el.setAttribute(k,attrs[k]);el.setAttribute("fill","none");el.setAttribute("stroke","#F4F6F8");el.setAttribute("stroke-width","2.4");el.setAttribute("stroke-linecap","round");el.setAttribute("opacity","0.95");if(tear)el.setAttribute("class","tear");web.appendChild(el);}
angles.forEach(function(d){
var a=rad(d),c=Math.cos(a),s=Math.sin(a);
var tx=Math.abs(c)>1e-6?HALF/Math.abs(c):1e9;
var ty=Math.abs(s)>1e-6?HALF/Math.abs(s):1e9;
var t=Math.min(tx,ty);
mk("line",{x1:(CX+c*HUB).toFixed(1),y1:(CY+s*HUB).toFixed(1),x2:(CX+c*t).toFixed(1),y2:(CY+s*t).toFixed(1)},!!tearSpokes[d]);
});
var rings=[74,102];
var tearRings={"102":{0:1,45:1,90:1},"74":{45:1}};
rings.forEach(function(r){
for(var i=0;i<angles.length;i++){
var d1=angles[i],d2=angles[(i+1)%angles.length];
var a1=rad(d1),a2=rad(d2);
var p1=[CX+Math.cos(a1)*r,CY+Math.sin(a1)*r];
var p2=[CX+Math.cos(a2)*r,CY+Math.sin(a2)*r];
var mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2;
var qx=mx+(CX-mx)*0.16,qy=my+(CY-my)*0.16;
var tear=tearRings[String(r)]&&tearRings[String(r)][d1];
mk("path",{d:"M"+p1[0].toFixed(1)+","+p1[1].toFixed(1)+" Q"+qx.toFixed(1)+","+qy.toFixed(1)+" "+p2[0].toFixed(1)+","+p2[1].toFixed(1)},!!tear);
}
});
var wrap=document.getElementById("vault-wrap");
var btn=document.getElementById("toggle-btn");
var icon=document.getElementById("status-icon");
var txt=document.getElementById("status-text");
var burstText=document.getElementById("burst-text");
var open=false;
var burstTimer=null;
function fireBurst(){
// when unlocking, the door swing finishes ~1.5s in, so delay the pop to land with it
var delay=open?1500:200;
wrap.classList.remove("show-burst");
if(burstTimer)clearTimeout(burstTimer);
burstTimer=setTimeout(function(){
burstText.textContent=open?"UNLOCKED!":"LOCKED!";
burstText.setAttribute("fill",open?"#23C552":"#E8352B");
wrap.classList.add("show-burst");
},delay);
}
function render(){
wrap.classList.toggle("open",open);
btn.textContent=open?"Lock the safe":"Unlock the safe";
icon.className=open?"ti ti-lock-open":"ti ti-lock";
txt.textContent=open?"Unlocked — you broke free":"Locked — web intact";
fireBurst();
}
btn.addEventListener("click",function(){open=!open;render();});
document.getElementById("dial").addEventListener("click",function(){open=!open;render();});
})();
</script>
